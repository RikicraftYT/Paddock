<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Modalità "app" quando aggiunta alla schermata Home dell'iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Paddock">
  <meta name="theme-color" content="#0e0e10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f5" media="(prefers-color-scheme: light)">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">

  <title>Paddock</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Applica subito il tema salvato, per evitare un lampo di colore sbagliato -->
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('paddock:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Vai al contenuto</a>

  <header class="topbar">
    <div class="topbar-row">
      <span class="brand" aria-hidden="true"><span class="brand-dot"></span>Paddock</span>
      <!-- Pulsanti generati da js/app.js in base a js/series/registry.js -->
      <nav class="seg seg-main" id="tabs" aria-label="Campionato"></nav>
      <div class="actions">
      <button class="icon-btn" id="open-settings" aria-label="Impostazioni e filtro sessioni" title="Impostazioni e filtro sessioni" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span class="btn-label" aria-hidden="true">Filtri</span>
      </button>
      <button class="icon-btn" id="refresh" aria-label="Aggiorna i dati" title="Aggiorna i dati">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <span class="btn-label" aria-hidden="true">Aggiorna</span>
      </button>
      </div>
    </div>
    <!-- Sul telefono #views diventa la barra in basso (Gare · Mondiale) -->
    <div class="topbar-row topbar-sub">
      <nav class="seg seg-sub" id="views" aria-label="Sezione"></nav>
      <nav class="seg seg-sub" id="classes" aria-label="Classe" hidden></nav>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <div class="msg">Caricamento…</div>
  </main>

  <!-- Annunci per VoiceOver (caricamenti, errori) -->
  <div id="status" class="sr-only" role="status" aria-live="polite"></div>

  <!-- Impostazioni: filtro sessioni e tema -->
  <dialog id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <div class="dialog-body">
        <h2 id="settings-title">Impostazioni</h2>

        <fieldset id="filter-set">
          <legend>Sessioni da mostrare</legend>
          <p class="hint">Vale per tutti i campionati.</p>
          <label class="opt"><input type="checkbox" name="practice"> Prove libere</label>
          <label class="opt"><input type="checkbox" name="quali"> Qualifiche e Superpole</label>
          <label class="opt"><input type="checkbox" name="sprint"> Sprint e Superpole Race</label>
          <label class="opt"><input type="checkbox" name="race"> Gare</label>
        </fieldset>

        <fieldset id="theme-set">
          <legend>Aspetto</legend>
          <label class="opt"><input type="radio" name="theme" value="auto"> Automatico (come l'iPhone)</label>
          <label class="opt"><input type="radio" name="theme" value="light"> Chiaro</label>
          <label class="opt"><input type="radio" name="theme" value="dark"> Scuro</label>
        </fieldset>
      </div>
      <div class="dialog-actions">
        <button class="btn" value="close">Fatto</button>
      </div>
    </form>
  </dialog>

  <!--
    Ordine di caricamento: moduli di base, client delle API,
    campionati, infine interfaccia e avvio.
    Script classici (non moduli ES) così l'app si apre anche con un doppio clic.
  -->
  <script src="js/core/config.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/core/cache.js"></script>

  <script src="js/api/jolpica.js"></script>
  <script src="js/api/openf1.js"></script>
  <script src="js/api/paddock-data.js"></script>

  <script src="js/series/registry.js"></script>
  <script src="js/series/f1.js"></script>
  <script src="js/series/robot-series.js"></script>
  <script src="js/series/motogp.js"></script>
  <script src="js/series/sbk.js"></script>

  <script src="js/ui/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
